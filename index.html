<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agradecimento & PIX - Djane & Theo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2c2520;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Cormorant Garamond', serif;
    }

    /* Card do Convite */
    .convite-card {
      position: relative;
      width: 100%;
      max-width: 430px;
      aspect-ratio: 9 / 16;
      background: url('convite.png') no-repeat center top;
      background-size: 100% 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Nova chave PIX sobreposta ao campo da imagem */
    .pix-numero {
      position: absolute;
      top: 62.2%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.55rem;
      font-weight: 700;
      color: #2b2b2b;
      letter-spacing: 2px;
      background-color: #f7f1e5;
      width: 58%;
      text-align: center;
      padding: 3px 0;
      border-radius: 4px;
    }

    /* Botão transparente exatamente sobre o botão de copiar da imagem */
    .btn-copiar {
      position: absolute;
      top: 71.2%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 58%;
      height: 46px;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .btn-copiar:active {
      transform: translate(-50%, -50%) scale(0.96);
    }

    /* Novos Nomes sobrepostos */
    .nomes-noivos {
      position: absolute;
      top: 83.5%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.45rem;
      font-weight: 700;
      font-style: italic;
      color: #2c2c2c;
      background-color: #f7f1e5;
      width: 62%;
      text-align: center;
      padding: 2px 0;
    }

    /* Aviso ao copiar */
    #toast {
      visibility: hidden;
      min-width: 180px;
      background-color: #2b2b2b;
      color: #fff;
      text-align: center;
      border-radius: 20px;
      padding: 10px 16px;
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.95rem;
      font-family: sans-serif;
      opacity: 0;
      transition: opacity 0.3s;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="convite-card">
    
    <!-- Chave PIX -->
    <div class="pix-numero" id="chavePix">85994400202</div>

    <!-- Botão de Ação -->
    <button class="btn-copiar" onclick="copiarPix()"></button>

    <!-- Nomes dos Noivos -->
    <div class="nomes-noivos">Djane & Theo</div>

    <!-- Mensagem de Confirmação -->
    <div id="toast">Chave PIX copiada!</div>

  </div>

  <script>
    function copiarPix() {
      const chave = document.getElementById("chavePix").innerText;
      navigator.clipboard.writeText(chave).then(() => {
        const toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(() => { 
          toast.className = toast.className.replace("show", ""); 
        }, 2000);
      }).catch(err => {
        alert("Chave PIX: " + chave);
      });
    }
  </script>

</body>
</html>
